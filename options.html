<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>設定 - Date Bookmark Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            color: #333;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            margin-top: 4px;
            margin-right: 8px;
            cursor: pointer;
        }
        .checkbox-group label {
            cursor: pointer;
            font-weight: normal;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        #saveButton {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
        }
        #saveButton:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 10px;
            color: green;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>設定 (Settings)</h1>
    
    <div class="form-group">
        <label for="language">右クリックメニューの言語 (Context Menu Language)</label>
        <select id="language">
            <option value="ja">日本語 (Japanese)</option>
            <option value="en">English (英語)</option>
            <option value="zh">简体中文 (Chinese)</option>
            <option value="ko">한국어 (Korean)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="dateFormat">日付フォーマット (Date Format)</label>
        <select id="dateFormat">
            <option value="yyyy-MM-dd">yyyy-MM-dd (例: 2026-03-01)</option>
            <option value="yyyyMMdd">yyyyMMdd (例: 20260301)</option>
            <option value="yyyy/MM/dd">yyyy/MM/dd (例: 2026/03/01)</option>
            <option value="MMDD">MMDD (例: 0301)</option>
            <option value="MM-DD">MM-DD (例: 03-01)</option>
            <option value="MM/DD">MM/DD (例: 03/01)</option>
        </select>
    </div>

    <div class="form-group checkbox-group">
        <input type="checkbox" id="alwaysGroupCurrentMonth">
        <label for="alwaysGroupCurrentMonth">
            当月分も月別フォルダにまとめる (先に常にまとめる)<br>
            <span style="font-size: 12px; color: #666;">
                Always group current month's folders first
            </span>
        </label>
    </div>

    <button id="saveButton">保存 (Save)</button>
    <div id="status"></div>

    <script src="options.js"></script>
</body>
</html>
