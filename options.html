<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>設定 - Date Bookmark Manager</title>
    <style>
        :root {
            --paper: #E7EAE1;
            --paper-card: #F4F6EF;
            --ink: #18211F;
            --ink-2: #586460;
            --line: #CBD2C7;
            --grid: rgba(28, 107, 82, 0.06);
            --stamp: #1C6B52;
            --stamp-deep: #134E3B;
            --stamp-tint: #DDE9E1;
            --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            font-family: var(--sans);
            padding: 28px 22px;
            width: 380px;
            margin: 0 auto;
            color: var(--ink);
            line-height: 1.6;
            background-color: var(--paper);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .eyebrow {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--stamp);
            margin: 0 0 4px;
        }
        h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 22px; }

        .form-group { margin-bottom: 18px; }
        label.field-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        label.field-label .en { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--ink-2); letter-spacing: 0.02em; }

        select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--sans);
            color: var(--ink);
            background: var(--paper-card);
            cursor: pointer;
        }
        select:focus-visible { outline: 3px solid var(--stamp-tint); outline-offset: 1px; border-color: var(--stamp); }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: var(--paper-card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .checkbox-group input { margin-top: 3px; cursor: pointer; accent-color: var(--stamp); width: 16px; height: 16px; flex-shrink: 0; }
        .checkbox-group label { cursor: pointer; font-size: 13px; font-weight: 700; }
        .checkbox-group label .en { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--ink-2); margin-top: 2px; }

        #saveButton {
            font-family: var(--sans);
            background: var(--stamp);
            color: var(--paper-card);
            border: none;
            padding: 12px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            margin-top: 6px;
        }
        #saveButton:hover { background: var(--stamp-deep); }

        #status {
            margin-top: 10px;
            color: var(--stamp-deep);
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        .donate { text-align: center; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; }
        .donate .en { font-family: var(--mono); font-size: 11px; }
        .donate-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 11px;
            padding: 8px 16px;
            border: 1.5px solid var(--stamp);
            color: var(--stamp);
            background: var(--paper-card);
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
        }
        .donate-chip:hover { background: var(--stamp-tint); }

        .mi { width: 1.15em; height: 1.15em; vertical-align: -0.18em; fill: currentColor; }
        button:focus-visible, a:focus-visible { outline: 3px solid var(--stamp-tint); outline-offset: 2px; }
    </style>
</head>
<body>
    <p class="eyebrow">Settings</p>
    <h1>表示と保存の設定</h1>

    <div class="form-group">
        <label class="field-label" for="language">右クリックメニューの言語 <span class="en">context menu language</span></label>
        <select id="language">
            <option value="ja">日本語 (Japanese)</option>
            <option value="en">English (英語)</option>
            <option value="zh">简体中文 (Chinese)</option>
            <option value="ko">한국어 (Korean)</option>
        </select>
    </div>

    <div class="form-group">
        <label class="field-label" for="dateFormat">日付フォーマット <span class="en">date format</span></label>
        <select id="dateFormat">
            <option value="yyyy-MM-dd">yyyy-MM-dd (例: 2026-03-01)</option>
            <option value="yyyyMMdd">yyyyMMdd (例: 20260301)</option>
            <option value="yyyy/MM/dd">yyyy/MM/dd (例: 2026/03/01)</option>
            <option value="MMDD">MMDD (例: 0301)</option>
            <option value="MM-DD">MM-DD (例: 03-01)</option>
            <option value="MM/DD">MM/DD (例: 03/01)</option>
        </select>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="alwaysGroupCurrentMonth">
        <label for="alwaysGroupCurrentMonth">
            当月分も月別フォルダにまとめる（先に常にまとめる）
            <span class="en">Always group current month's folders first</span>
        </label>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="analyticsEnabled" checked>
        <label for="analyticsEnabled">
            匿名の利用統計を送信して開発を支援する
            <span class="en">Send anonymous usage stats — no personal data</span>
        </label>
    </div>

    <button id="saveButton">保存する</button>
    <div id="status"></div>

    <div class="donate">
        このツールが役立ったら、開発の継続を応援してもらえると嬉しいです。
        <span class="en">If this tool helps, consider supporting it.</span>
        <br>
        <a class="donate-chip" id="donateLink" href="https://buymeacoffee.com/nightwatchwife" target="_blank" rel="noopener noreferrer">
            <svg class="mi" viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2a2 2 0 0 0 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
            Buy me a coffee
        </a>
    </div>

    <script src="options.js"></script>
</body>
</html>
